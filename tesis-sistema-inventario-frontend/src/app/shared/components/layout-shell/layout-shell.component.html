<div class="min-h-screen flex flex-col bg-paper">

  <!-- Top Navigation Bar (sticky) -->
  <header class="sticky top-0 z-30 bg-paper border-b border-concrete">

    <!-- Row 1: eyebrow · logo plate · user -->
    <div class="relative max-w-page mx-auto h-16 px-4 sm:px-8 lg:px-12 flex items-center justify-between gap-4">
      <div class="hidden md:flex items-center gap-3 text-label uppercase">
        <span class="text-carbon">Innovatecno</span>
        <span class="text-concrete">/</span>
        <span class="text-ash">Control de inventarios</span>
      </div>

      <!-- Logo plate -->
      <a routerLink="/dashboard"
         class="md:absolute md:left-1/2 md:-translate-x-1/2 inline-flex items-center bg-carbon text-paper rounded-nav px-4 py-2 text-[13px] uppercase tracking-[0.12em] leading-none">
        Innovatecno
      </a>

      <!-- User + logout -->
      <div class="flex items-center gap-2" *ngIf="user()">
        <div class="hidden sm:inline-flex items-center gap-2 border border-concrete rounded-nav px-3 py-1.5 text-label uppercase">
          <span class="text-ash">{{ user()!.role }}</span>
          <span class="text-carbon">{{ user()!.name }}</span>
        </div>
        <button type="button" (click)="logout()" class="btn-pill-ghost btn-pill-sm" title="Cerrar sesión">
          <ng-icon name="heroArrowRightOnRectangle" class="text-sm" />
          <span class="hidden sm:inline">Salir</span>
        </button>
      </div>
    </div>

    <!-- Row 2: section links -->
    <nav class="border-t border-concrete">
      <div class="max-w-page mx-auto px-4 sm:px-8 lg:px-12 flex items-center gap-1 overflow-x-auto py-2">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          routerLinkActive="!bg-carbon !text-paper !border-carbon"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="shrink-0 inline-flex items-center rounded-full border border-transparent px-3.5 py-1.5
                 text-label uppercase text-carbon hover:border-carbon transition-colors duration-150"
        >
          {{ link.label }}
        </a>
      </div>
    </nav>
  </header>

  <!-- Page Content -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="border-t border-concrete">
    <div class="max-w-page mx-auto px-4 sm:px-8 lg:px-12 py-6 flex flex-col sm:flex-row justify-between gap-2 text-label uppercase text-ash">
      <span>Innovatecno — Sistema de inventario</span>
      <span>Catálogo · Entradas · Salidas · Trazabilidad</span>
    </div>
  </footer>
</div>
