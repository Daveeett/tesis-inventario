<div class="drawer lg:drawer-open min-h-screen bg-[#F6FAFD]">
  <input id="main-drawer" type="checkbox" class="drawer-toggle" />

  <!-- Page Content -->
  <div class="drawer-content flex flex-col min-h-screen bg-[#F6FAFD]">
    <!-- Mobile Topbar -->
    <div class="navbar bg-[#0A1931] text-white shadow-md lg:hidden px-4">
      <label for="main-drawer" class="btn btn-ghost drawer-button text-[#B3CFE5] hover:bg-[#1A3D63]">
        <ng-icon name="heroSquares2x2" class="text-xl" />
      </label>
      <span class="font-bold text-white tracking-wider ml-2">INNOVATECNO</span>
    </div>

    <!-- Main Content -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 bg-[#F6FAFD]">
      <router-outlet />
    </main>
  </div>

  <!-- Sidebar -->
  <div class="drawer-side z-20">
    <label for="main-drawer" class="drawer-overlay"></label>
    <aside class="bg-[#0A1931] border-r border-[#1A3D63] w-64 min-h-full flex flex-col text-white shadow-xl">

      <!-- Brand -->
      <div class="flex items-center gap-3 px-5 py-6 border-b border-[#1A3D63]">
        <div class="w-10 h-10 rounded-lg bg-[#1A3D63] border border-[#4A7FA7]/40 flex items-center justify-center shadow-inner">
          <ng-icon name="heroBuildingStorefront" class="text-[#B3CFE5] text-2xl" />
        </div>
        <div>
          <p class="font-bold text-base tracking-wide text-white leading-tight">INNOVATECNO</p>
          <p class="text-xs text-[#B3CFE5]/80 font-medium">Sistema de Inventario</p>
        </div>
      </div>

      <!-- Nav Links -->
      <nav class="flex-1 px-3 py-5 space-y-1.5 overflow-y-auto">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          routerLinkActive="bg-[#1A3D63] text-white font-semibold shadow-sm border-l-4 border-[#4A7FA7]"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium
                 text-[#B3CFE5] hover:bg-[#1A3D63]/60 hover:text-white transition-all duration-150"
        >
          <ng-icon [name]="link.icon" class="text-lg flex-shrink-0" />
          {{ link.label }}
        </a>
      </nav>

      <!-- User Badge -->
      <div class="p-4 border-t border-[#1A3D63] bg-[#0A1931]/80" *ngIf="user()">
        <div class="flex items-center gap-3 mb-3 bg-[#1A3D63]/50 p-2.5 rounded-lg border border-[#4A7FA7]/20">
          <div class="avatar placeholder">
            <div class="bg-[#4A7FA7] text-white rounded-full w-9 shadow-sm flex items-center justify-center">
              <span class="text-sm font-bold">{{ user()!.name.slice(0,1).toUpperCase() }}</span>
            </div>
          </div>
          <div class="overflow-hidden">
            <p class="font-semibold text-sm truncate text-white leading-tight">{{ user()!.name }}</p>
            <p class="text-xs text-[#B3CFE5]/70 truncate capitalize">{{ user()!.role }}</p>
          </div>
        </div>
        <button
          (click)="logout()"
          class="btn btn-sm bg-[#1A3D63]/40 border-[#4A7FA7]/40 text-[#B3CFE5] hover:bg-rose-950/40 hover:text-rose-300 hover:border-rose-500/50 w-full gap-2 transition-all duration-150"
        >
          <ng-icon name="heroArrowRightOnRectangle" class="text-base" />
          Cerrar sesión
        </button>
      </div>

    </aside>
  </div>
</div>
