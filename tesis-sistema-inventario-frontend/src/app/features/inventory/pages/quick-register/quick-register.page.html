<div class="page-container">

  <div class="page-header">
    <div>
      <span class="eyebrow mb-4">Inventario · Entrada</span>
      <h1 class="h-display">Registro rápido de mercadería</h1>
      <p class="lede">Ingreso masivo de existencias para reposición inmediata en almacén.</p>
    </div>
    <a routerLink="/inventory/history" class="btn-pill-ghost">
      <ng-icon name="heroClock" class="text-sm" />
      Ver historial
    </a>
  </div>

  <!-- Notices -->
  <div *ngIf="success()" class="notice notice-muted mb-6">
    <ng-icon name="heroCheck" class="text-base shrink-0 mt-0.5" />
    <span>{{ success() }}</span>
  </div>
  <div *ngIf="error()" class="notice mb-6">
    <ng-icon name="heroExclamationTriangle" class="text-base shrink-0 mt-0.5" />
    <span>{{ error() }}</span>
  </div>

  <div class="panel max-w-5xl">

    <div *ngIf="loading()" class="flex items-center gap-3 px-6 py-16 text-label-sm uppercase text-ash">
      <span class="loader text-carbon"></span> Cargando productos…
    </div>

    <ng-container *ngIf="!loading()">
      <!-- Reason -->
      <div class="panel-body border-b border-concrete">
        <label class="field-label" for="entry-reason">Motivo o referencia de entrada *</label>
        <input id="entry-reason" type="text" [(ngModel)]="reason" class="field" placeholder="Ej. Orden de compra N° 1042, reposición semanal…" />
      </div>

      <!-- Items -->
      <div class="overflow-x-auto">
        <table class="manifest">
          <thead>
            <tr>
              <th class="w-10 tnum">#</th>
              <th>Producto</th>
              <th class="w-32">Stock actual</th>
              <th class="w-40">Cantidad entrada</th>
              <th class="w-12"></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of items; let i = index" class="hover:!bg-paper">
              <td class="tnum text-label text-ash">{{ (i + 1).toString().padStart(2, '0') }}</td>
              <td>
                <div class="relative mb-2">
                  <ng-icon name="heroMagnifyingGlass" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-ash text-base" />
                  <input type="text" [(ngModel)]="item.term" (ngModelChange)="onSearch(i)" class="field pl-10"
                    placeholder="Buscar por nombre, marca, modelo o serie…"
                    [attr.aria-label]="'Buscar producto de la fila ' + (i + 1)" />
                </div>
                <select [(ngModel)]="item.productId" (ngModelChange)="onProductSelect(i)" class="field"
                  [attr.aria-label]="'Producto de la fila ' + (i + 1)">
                  <option value="">— Seleccionar producto ({{ filteredProducts(item).length }}) —</option>
                  <option *ngFor="let p of filteredProducts(item)" [value]="p.id">
                    {{ p.name }} ({{ p.brand }})
                  </option>
                </select>
              </td>
              <td>
                <span *ngIf="item.productId" class="badge-pill tnum"
                  [class.badge-pill-solid]="item.currentStock <= 0">
                  <span *ngIf="item.currentStock > 0 && item.currentStock <= 5" class="dot-caution"></span>
                  {{ item.currentStock }}
                </span>
                <span *ngIf="!item.productId" class="text-ash">—</span>
              </td>
              <td>
                <input type="number" [(ngModel)]="item.quantity" class="field text-center tnum" min="1"
                  [attr.aria-label]="'Cantidad de entrada de la fila ' + (i + 1)" />
              </td>
              <td class="text-center">
                <button class="btn-round" [disabled]="items.length === 1" (click)="removeRow(i)" title="Eliminar fila">
                  <ng-icon name="heroXMark" class="text-base" />
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Actions -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 px-5 py-5 border-t border-carbon">
        <button type="button" class="btn-pill-ghost" (click)="addRow()">
          <ng-icon name="heroPlus" class="text-sm" />
          Agregar fila
        </button>
        <button type="button" class="btn-pill" [disabled]="saving()" (click)="register()">
          <span *ngIf="saving()" class="loader"></span>
          <ng-icon name="heroArrowDownTray" class="text-sm" *ngIf="!saving()" />
          {{ saving() ? 'Registrando…' : 'Confirmar entrada' }}
        </button>
      </div>
    </ng-container>

  </div>
</div>
