<div class="page-container max-w-4xl mx-auto">

  <div class="page-header flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-200">
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-[#0A1931] tracking-tight">Registro Rápido de Mercadería (Entrada)</h1>
      <p class="text-sm text-[#4A7FA7] font-medium mt-1">Ingreso masivo de existencias para reposición inmediata en almacén.</p>
    </div>
    <a routerLink="/inventory/history" class="btn btn-sm border-slate-300 bg-white text-[#0A1931] hover:bg-slate-100 rounded-xl font-semibold gap-2 transition-all">
      <ng-icon name="heroQueueList" class="text-base" />
      <span>Ver Historial</span>
    </a>
  </div>

  <!-- Alerts -->
  <div *ngIf="success()" class="p-4 mb-5 bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm rounded-xl flex gap-3 items-center">
    <ng-icon name="heroCheck" class="text-emerald-600 text-xl shrink-0" />
    <span class="font-medium">{{ success() }}</span>
  </div>
  <div *ngIf="error()" class="p-4 mb-5 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-xl flex gap-3 items-center">
    <ng-icon name="heroExclamationTriangle" class="text-rose-600 text-xl shrink-0" />
    <span class="font-medium">{{ error() }}</span>
  </div>

  <div class="bg-white border border-slate-200/90 shadow-xs rounded-2xl p-6 sm:p-8">

    <!-- Loading -->
    <div *ngIf="loading()" class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg text-[#1A3D63]"></span>
    </div>

    <ng-container *ngIf="!loading()">
      <!-- Reason -->
      <div class="mb-6">
        <label class="block text-xs font-bold text-[#0A1931] uppercase tracking-wider mb-2">Motivo o Referencia de Entrada *</label>
        <input type="text" [(ngModel)]="reason" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm text-[#0A1931] focus:outline-none focus:border-[#1A3D63] focus:ring-2 focus:ring-[#1A3D63]/20" placeholder="Ej. Orden de compra N° 1042, Reposición semanal..." />
      </div>

      <!-- Items Table -->
      <div class="overflow-x-auto rounded-xl border border-slate-200/80 mb-6">
        <table class="table table-sm w-full">
          <thead>
            <tr class="bg-[#1A3D63] text-white">
              <th class="w-1/2 text-white py-3.5">Producto</th>
              <th class="w-32 text-center text-white py-3.5">Stock Actual</th>
              <th class="w-40 text-center text-white py-3.5">Cantidad Entrada</th>
              <th class="w-12 text-center text-white py-3.5"></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of items; let i = index" class="hover:bg-slate-50/80 transition-colors">
              <td class="py-3">
                <select
                  [(ngModel)]="item.productId"
                  (ngModelChange)="onProductSelect(i)"
                  class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm bg-white text-[#0A1931] font-medium focus:outline-none focus:border-[#1A3D63]"
                >
                  <option value="">— Seleccionar producto —</option>
                  <option *ngFor="let p of products()" [value]="p.id">
                    {{ p.name }} ({{ p.brand }})
                  </option>
                </select>
              </td>
              <td class="text-center py-3">
                <span *ngIf="item.productId" class="px-2.5 py-0.5 text-xs font-bold rounded-full border"
                  [class.bg-rose-50]="item.currentStock <= 0"
                  [class.text-rose-700]="item.currentStock <= 0"
                  [class.border-rose-200]="item.currentStock <= 0"
                  [class.bg-amber-50]="item.currentStock > 0 && item.currentStock <= 5"
                  [class.text-amber-800]="item.currentStock > 0 && item.currentStock <= 5"
                  [class.border-amber-200]="item.currentStock > 0 && item.currentStock <= 5"
                  [class.bg-emerald-50]="item.currentStock > 5"
                  [class.text-emerald-800]="item.currentStock > 5"
                  [class.border-emerald-200]="item.currentStock > 5">
                  {{ item.currentStock }}
                </span>
                <span *ngIf="!item.productId" class="text-slate-400 font-mono">—</span>
              </td>
              <td class="py-3">
                <input
                  type="number"
                  [(ngModel)]="item.quantity"
                  class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm text-[#0A1931] text-center font-mono font-bold focus:outline-none focus:border-[#1A3D63]"
                  min="1"
                />
              </td>
              <td class="text-center py-3">
                <button class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all disabled:opacity-30" [disabled]="items.length === 1" (click)="removeRow(i)" title="Eliminar fila">
                  <ng-icon name="heroXMark" class="text-lg" />
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Actions -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
        <button type="button" class="w-full sm:w-auto px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-[#0A1931] border border-slate-300 bg-white rounded-xl hover:bg-slate-100 transition-all flex items-center justify-center gap-2" (click)="addRow()">
          <ng-icon name="heroPlusCircle" class="text-base" />
          <span>Agregar Fila</span>
        </button>
        <button
          type="button"
          class="w-full sm:w-auto px-6 py-2.5 bg-[#1A3D63] hover:bg-[#0A1931] text-white text-xs font-bold uppercase tracking-wider rounded-xl transition-all shadow-md shadow-[#1A3D63]/20 flex items-center justify-center gap-2 disabled:opacity-50"
          [disabled]="saving()"
          (click)="register()"
        >
          <span *ngIf="saving()" class="loading loading-spinner loading-xs text-[#B3CFE5]"></span>
          <ng-icon name="heroArrowDownTray" class="text-base" *ngIf="!saving()" />
          <span>{{ saving() ? 'Registrando...' : 'Confirmar Entrada' }}</span>
        </button>
      </div>
    </ng-container>

  </div>
</div>
