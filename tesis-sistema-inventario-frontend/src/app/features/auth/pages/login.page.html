<div class="min-h-screen bg-paper flex w-full">

  <!-- Left: full-bleed hero panel -->
  <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden flex-col justify-between p-12 bg-carbon">
    <img
      src="assets/login-hero.jpg"
      alt="Almacén de inventario InnovaTecno"
      class="absolute inset-0 w-full h-full object-cover object-center brightness-[0.62]"
    />

    <div class="relative z-10">
      <span class="inline-flex items-center bg-paper text-carbon rounded-nav px-4 py-2 text-[13px] uppercase tracking-[0.12em] leading-none">
        Innovatecno
      </span>
    </div>

    <div class="relative z-10 max-w-xl">
      <span class="block text-label uppercase text-paper/80 mb-5">Catálogo · Existencias · Trazabilidad</span>
      <h2 class="text-display xl:text-[56px] uppercase text-paper m-0" style="line-height: 0.97">
        Gestión precisa de existencias y almacén
      </h2>
    </div>
  </div>

  <!-- Right: login form -->
  <div class="w-full lg:w-1/2 flex flex-col">
    <div class="flex items-center justify-between px-6 sm:px-12 h-16 border-b border-concrete">
      <span class="lg:hidden inline-flex items-center bg-carbon text-paper rounded-nav px-4 py-2 text-[13px] uppercase tracking-[0.12em] leading-none">
        Innovatecno
      </span>
      <span class="hidden lg:inline text-label uppercase text-ash">Sistema de inventario</span>
      <span class="text-label uppercase text-ash">Acceso (ES)</span>
    </div>

    <div class="flex-1 flex items-center px-6 sm:px-12 lg:px-16 py-12">
      <div class="w-full max-w-md">

        <span class="eyebrow mb-4">Acceso al sistema</span>
        <h1 class="h-heading">Iniciar sesión</h1>
        <p class="text-[14px] text-iron mt-4 mb-10">Ingrese sus credenciales para continuar.</p>

        <!-- Error -->
        <div *ngIf="error" class="notice mb-8">
          <ng-icon name="heroExclamationTriangle" class="text-base shrink-0 mt-0.5" />
          <div>
            <p class="text-label uppercase m-0 mb-1">Error de autenticación</p>
            <p class="text-[13px] text-iron m-0">{{ error }}</p>
          </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
          <div>
            <label for="email" class="field-label">Correo electrónico</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="correo@ejemplo.com"
              class="field"
              [ngClass]="{ 'field-invalid': form.get('email')?.touched && form.get('email')?.invalid }"
            />
            <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="field-hint">
              <span class="dot-caution"></span> Ingrese un correo electrónico válido
            </p>
          </div>

          <div>
            <label for="password" class="field-label">Contraseña</label>
            <div class="relative">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••"
                class="field pr-20"
                [ngClass]="{ 'field-invalid': form.get('password')?.touched && form.get('password')?.invalid }"
              />
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-label uppercase text-ash hover:text-carbon"
                title="Mostrar/ocultar contraseña"
              >
                {{ showPassword ? 'Ocultar' : 'Mostrar' }}
              </button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 pt-4">
            <button type="submit" class="btn-pill flex-1" [disabled]="loading">
              <span *ngIf="loading" class="loader"></span>
              <span>{{ loading ? 'Autenticando…' : 'Acceder al sistema' }}</span>
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

</div>
